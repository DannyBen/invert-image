## Core

run: go run -ldflags="-X main.Version=$(go run ./tools/build-version.go)" . "$@"
#? invert an image
#$ FILE [OUTFILE]

build: scripts/build linux
#? build a Linux executable in dist/

build-windows: scripts/build windows
#? build a Windows executable in dist/

## Testing & Linting

test: go test ./... "$@"
#? run tests

fmt: gofmt -w .
#? format Go code

vet: go vet ./...
#? check for suspicious code and likely mistakes

check:
  gofmt -w .
  go vet ./...
  go test ./...
#? format, vet, and test everything

## Dependencies

tidy: go mod tidy
#? clean up and sync dependencies

verify: go mod verify
#? verify downloaded dependencies

## Releases

version: go run ./tools/build-version.go
#? show the tag-derived build version

release-check: goreleaser check
#? validate the release configuration

release-snapshot: goreleaser release --snapshot --clean --parallelism 1
#? build local release archives without publishing
